server.port=${PORT:8080}

# Database Datasource Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/kingstvdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate Optimizations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security & Secrets Config
jwt.secret=${JWT_SECRET:Kings24x7NewsPortalBilingualSecretJwtSigningKey2026Secure256Bit}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://king-tv.test-technoprint.online,https://www.king-tv.test-technoprint.online,http://localhost:5173,http://localhost:3000}

# Actuator Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# File Upload Security & Size Limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true

# Encoding & Server Settings
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Swagger/OpenAPI Documentation Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none

# Disable Spring Data Redis repositories auto-scanning (prevents 60-second startup delay)
spring.data.redis.repositories.enabled=false

# Jackson Deserialization: Ignore unknown JSON fields sent by the frontend
# This prevents 500 errors when the frontend sends extra fields that don't map to any entity property.
spring.jackson.deserialization.fail-on-unknown-properties=false

# AWS S3 Cloud Storage Config
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket=${AWS_S3_BUCKET:kingstv-media-bucket-535252060801}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:https://s3.ap-south-1.amazonaws.com}
aws.s3.cdn-url=${AWS_S3_CDN_URL:https://kingstv-media-bucket-535252060801.s3.ap-south-1.amazonaws.com}
aws.s3.use-acl=${AWS_S3_USE_ACL:false}


